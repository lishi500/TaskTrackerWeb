name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Before checkout, so Windows does not rewrite line endings: the tests assume LF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check server.mjs
      - name: Tests
        run: node scripts/test-all.mjs
