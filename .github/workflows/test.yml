name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Before checkout, so Windows does not rewrite line endings: the tests assume LF.
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # DIAGNOSTIC (not a test). One Windows runner once killed test-discovery with exit code 0xC0000409 and no output
      # at its fs.cpSync call (a destination folder named with non-ASCII characters). This repeats that copy, and the
      # alternatives, each in its own process, and prints the result as a notice that needs no login to read.
      - name: "DIAGNOSTIC: fs.cpSync into a non-ASCII folder"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          output=$(node scripts/ci-cpsync-repro.mjs 2>&1)
          code=$?
          output=${output//'%'/'%25'}
          output=${output//$'\r'/}
          output=${output//$'\n'/'%0A'}
          echo "::notice title=cpsync-repro::node $(node -p process.version), driver exit $code%0A$output"
      - name: Syntax check
        shell: bash
        run: node --check server.mjs
      # bash on every OS (Git Bash on Windows) so the output can be kept in a file as well as in the log.
      - name: Tests
        shell: bash
        run: |
          set +e
          node scripts/test-all.mjs 2>&1 | tee test-output.txt
          exit "${PIPESTATUS[0]}"
      # Job logs need a login to read; annotations do not:
      #   GET /repos/<owner>/<repo>/check-runs/<job id>/annotations
      - name: Failure annotations (public) and machine description
        if: failure()
        shell: bash
        run: node scripts/ci-annotate.mjs test-output.txt
